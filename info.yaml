project:
  title:        "UART"
  author:       "me"
  discord:      ""
  description:  "8-bit UART transmitter and receiver"
  language:     "Verilog"
  clock_hz:     200000000

  tiles: "1x1"

  top_module: "tt_um_uart"

  source_files:
    - "tt_um_uart.v"
    - "baud_generator.v"

    - "Tx/uart_tx.v"
    - "Tx/tx_fsm.v"
    - "Tx/tx_register.v"
    
    - "Rx/uart_rx.v"
    - "Rx/rx_fsm.v"
    - "Rx/sipo_register.v"
    - "Rx/synchronizer.v"
    - "Rx/output_register.v"
    - "Rx/bit_counter.v"


pinout:
  # Inputs
  ui[0]: "TX_DATA[0]"
  ui[1]: "TX_DATA[1]"
  ui[2]: "TX_DATA[2]"
  ui[3]: "TX_DATA[3]"
  ui[4]: "TX_DATA[4]"
  ui[5]: "TX_DATA[5]"
  ui[6]: "TX_DATA[6]"
  ui[7]: "TX_DATA[7]"

  # Outputs
  uo[0]: "RX_DATA[0]"
  uo[1]: "RX_DATA[1]"
  uo[2]: "RX_DATA[2]"
  uo[3]: "RX_DATA[3]"
  uo[4]: "RX_DATA[4]"
  uo[5]: "RX_DATA[5]"
  uo[6]: "RX_DATA[6]"
  uo[7]: "RX_DATA[7]"

  # Bidirectional pins
  uio[0]: "RX"
  uio[1]: "TX_START"
  uio[2]: "TX"
  uio[3]: "TX_BUSY"
  uio[4]: "TX_DONE"
  uio[5]: "RX_DONE"
  uio[6]: "FRAMING_ERROR"
  uio[7]: ""

yaml_version: 6
